<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subsanar documento — TUPA UNSAAC</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <header class="tupa-header">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <a href="mis-tramites.html" class="d-flex align-items-center gap-3">
        <div class="logo-circulo">UNSAAC</div>
        <div>
          <h1 class="h6 mb-0 fw-semibold text-white">Subsanar documento observado</h1>
          <p class="subtitulo d-none d-sm-block">Universidad Nacional de San Antonio Abad del Cusco</p>
        </div>
      </a>
      <div class="d-flex align-items-center gap-2">
        <div id="notificaciones-widget"></div>
        <a href="mis-tramites.html" class="btn btn-outline-light btn-sm">Mis trámites</a>
      </div>
    </div>
  </header>

  <div class="container py-4" style="max-width: 700px">
    <div id="estado-carga" class="text-muted">Cargando...</div>
    <div id="error-general" class="alert alert-danger" hidden></div>

    <div id="contenido-subsanar" hidden>
      <div class="alert banner-warning-style mb-4" style="background-color:#FEF3C7;border:1px solid #FCD34D;color:#92400E;">
        <div class="d-flex align-items-start gap-2">
          <i class="bi bi-exclamation-triangle mt-1"></i>
          <div>
            <p class="mb-1 fw-medium">Observación registrada</p>
            <p class="mb-0 small" id="texto-comentario"></p>
          </div>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body p-4">
          <p class="mb-1 fw-medium small">Documento a reemplazar</p>
          <p class="mb-3 text-muted small" id="texto-requisito"></p>

          <input type="file" class="form-control mb-2" id="archivo-subsanar" />
          <p class="small mb-0" id="mensaje-archivo"></p>
        </div>
      </div>

      <div class="alert alert-danger" id="error-subsanar" hidden></div>
      <div class="alert alert-success" id="exito-subsanar" hidden></div>

      <button type="button" class="btn btn-institucional w-100" id="btn-reenviar" disabled>
        Reenviar expediente
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/sesion.js"></script>
  <script src="static/js/notificaciones.js"></script>
  <script src="static/js/subsanar.js"></script>
</body>
</html>
