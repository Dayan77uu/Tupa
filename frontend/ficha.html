<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha del trámite — TUPA UNSAAC</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <header class="tupa-header">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <a href="catalogo.html" class="d-flex align-items-center gap-3">
        <div class="logo-circulo">UNSAAC</div>
        <div>
          <h1 class="h6 mb-0 fw-semibold text-white">Catálogo TUPA</h1>
          <p class="subtitulo d-none d-sm-block">Universidad Nacional de San Antonio Abad del Cusco</p>
        </div>
      </a>
      <a href="login.html" class="btn btn-dorado btn-sm">Iniciar solicitud</a>
    </div>
  </header>

  <div class="container py-4">
    <div id="estado-carga" class="text-muted">Cargando ficha...</div>
    <div id="error-ficha" class="alert alert-danger" hidden></div>

    <div id="contenido-ficha" class="row g-4" hidden>
      <!-- Contenido principal -->
      <div class="col-lg-8">
        <div class="card mb-4">
          <div class="card-body p-4">
            <div class="d-flex align-items-start justify-content-between mb-2">
              <span class="badge border text-dark bg-white" id="ficha-codigo"></span>
              <span class="badge badge-gratuito">Disponible</span>
            </div>
            <h2 class="titulo-institucional mb-3" id="ficha-nombre"></h2>
            <p class="text-muted mb-0" id="ficha-descripcion"></p>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body p-4">
            <h3 class="h6 titulo-institucional d-flex align-items-center gap-2 mb-3">
              <i class="bi bi-check-circle"></i> Requisitos
            </h3>
            <ul class="list-unstyled mb-0" id="ficha-requisitos"></ul>
          </div>
        </div>
      </div>

      <!-- Sidebar de información rápida -->
      <div class="col-lg-4">
        <div class="card tarjeta-info-rapida">
          <div class="card-body p-4">
            <h3 class="h6 titulo-institucional mb-3">Información rápida</h3>

            <div class="d-flex align-items-start gap-3 mb-3 info-rapida-item">
              <i class="bi bi-cash-stack mt-1"></i>
              <div>
                <p class="mb-0 fw-medium small">Costo</p>
                <p class="mb-0 text-muted small" id="ficha-costo"></p>
              </div>
            </div>
            <hr />
            <div class="d-flex align-items-start gap-3 mb-3 info-rapida-item">
              <i class="bi bi-clock mt-1"></i>
              <div>
                <p class="mb-0 fw-medium small">Plazo de atención</p>
                <p class="mb-0 text-muted small" id="ficha-plazo"></p>
              </div>
            </div>
            <hr />
            <div class="d-flex align-items-start gap-3 mb-3 info-rapida-item">
              <i class="bi bi-building mt-1"></i>
              <div>
                <p class="mb-0 fw-medium small">Oficina responsable</p>
                <p class="mb-0 text-muted small" id="ficha-oficina"></p>
              </div>
            </div>
            <hr />

            <a href="login.html" class="btn btn-institucional w-100 mb-2">Iniciar solicitud</a>
            <a href="catalogo.html" class="btn btn-outline-secondary w-100">Volver al catálogo</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="static/js/ficha.js"></script>
</body>
</html>
