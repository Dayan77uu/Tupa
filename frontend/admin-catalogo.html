<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión del catálogo — Panel administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <header class="tupa-header">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="logo-circulo">UNSAAC</div>
        <div>
          <h1 class="h6 mb-0 fw-semibold text-white">Gestión del catálogo TUPA</h1>
          <p class="subtitulo d-none d-sm-block">Panel del Administrador del Sistema</p>
        </div>
      </div>
      <div class="d-flex gap-2">
        <a href="admin-usuarios.html" class="btn btn-outline-light btn-sm">Usuarios</a>
        <a href="reportes.html" class="btn btn-outline-light btn-sm">Reportes</a>
        <a href="login.html" class="btn btn-outline-light btn-sm">Salir</a>
      </div>
    </div>
  </header>

  <div class="container py-4">
    <div id="estado-carga" class="text-muted">Cargando...</div>
    <div id="error-general" class="alert alert-danger" hidden></div>

    <div class="table-responsive" id="tabla-contenedor" hidden>
      <table class="table table-hover bg-white">
        <thead>
          <tr><th>Código</th><th>Nombre</th><th>Plazo (días)</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody id="tabla-catalogo"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Editar -->
  <div class="modal fade" id="modal-editar" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="h6 titulo-institucional mb-0" id="modal-editar-titulo">Editar trámite</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small">Plazo (días hábiles)</label>
              <input type="number" class="form-control" id="input-plazo" min="1" />
            </div>
            <div class="col-md-6">
              <label class="form-label small">Costo (S/)</label>
              <input type="number" step="0.01" class="form-control" id="input-costo" min="0" />
            </div>
            <div class="col-md-6">
              <label class="form-label small">Oficina responsable</label>
              <select class="form-select" id="input-oficina"></select>
            </div>
            <div class="col-12">
              <label class="form-label small">Descripción</label>
              <textarea class="form-control" id="input-descripcion" rows="2"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label small fw-bold">N° de resolución rectoral (obligatorio)</label>
              <input type="text" class="form-control" id="input-resolucion" placeholder="R-XXXX-2026-UNSAAC" />
            </div>
          </div>
          <div class="alert alert-danger py-2 small mt-3" id="error-editar" hidden></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-institucional" id="btn-guardar-cambios">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/config.js"></script>
  <script src="static/js/sesion.js"></script>
  <script src="static/js/admin-catalogo.js"></script>
</body>
</html>
