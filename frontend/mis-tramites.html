<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis trámites — TUPA UNSAAC</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <header class="tupa-header">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <a href="catalogo.html" class="d-flex align-items-center gap-3">
        <div class="logo-circulo">UNSAAC</div>
        <div>
          <h1 class="h6 mb-0 fw-semibold text-white">Mis trámites</h1>
          <p class="subtitulo d-none d-sm-block">Universidad Nacional de San Antonio Abad del Cusco</p>
        </div>
      </a>
      <div class="d-flex align-items-center gap-2">
        <div id="notificaciones-widget"></div>
        <a href="catalogo.html" class="btn btn-outline-light btn-sm">Catálogo</a>
      </div>
    </div>
  </header>

  <div class="container py-4">
    <div id="estado-carga" class="text-muted">Cargando...</div>
    <div id="error-general" class="alert alert-danger" hidden></div>

    <div id="sin-expedientes" class="text-center py-5" hidden>
      <i class="bi bi-folder2-open" style="font-size: 2.5rem; color: var(--unsaac-text-secondary)"></i>
      <h2 class="h6 text-muted mt-3 mb-1">Aún no tienes trámites registrados</h2>
      <a href="catalogo.html" class="btn btn-institucional btn-sm mt-2">Registrar un trámite</a>
    </div>

    <div id="contenedor-expedientes" class="row g-3"></div>
  </div>

  <!-- Modal de historial -->
  <div class="modal fade" id="modal-historial" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="h6 titulo-institucional mb-0" id="modal-historial-titulo">Historial del expediente</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modal-historial-cuerpo"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/sesion.js"></script>
  <script src="static/js/notificaciones.js"></script>
  <script src="static/js/mis-tramites.js"></script>
</body>
</html>
