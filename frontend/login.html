<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — TUPA UNSAAC</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh">
    <div class="card shadow-sm" style="width: 100%; max-width: 420px">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">TUPA UNSAAC</h1>
        <p class="text-muted text-center mb-4">Ingresa con tu correo institucional</p>

        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo institucional</label>
            <input
              type="email"
              class="form-control"
              id="correo"
              name="correo"
              placeholder="usuario@unsaac.edu.pe"
              autocomplete="username"
              required
            />
            <div class="mensaje-error-campo mt-1" id="error-correo" hidden></div>
          </div>

          <div class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="contrasena"
              name="contrasena"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="alert alert-danger" id="error-login" hidden></div>

          <button type="submit" class="btn btn-primary w-100" id="btn-login">
            Ingresar
          </button>

          <div class="text-center mt-3">
            <a href="catalogo.html" class="small">Consultar el catálogo TUPA sin iniciar sesión</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="static/js/login.js"></script>
</body>
</html>
