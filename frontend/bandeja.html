<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bandeja de expedientes — TUPA UNSAAC</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <header class="tupa-header">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="logo-circulo">UNSAAC</div>
        <div>
          <h1 class="h6 mb-0 fw-semibold text-white">Bandeja de expedientes</h1>
          <p class="subtitulo d-none d-sm-block">Panel administrativo — Universidad Nacional de San Antonio Abad del Cusco</p>
        </div>
      </div>
      <a href="login.html" class="btn btn-outline-light btn-sm" id="btn-salir">Salir</a>
    </div>
  </header>

  <div class="container py-4">
    <div id="estado-carga" class="text-muted">Cargando...</div>
    <div id="error-general" class="alert alert-danger" hidden></div>

    <div id="sin-expedientes" class="text-center py-5" hidden>
      <i class="bi bi-inbox" style="font-size: 2.5rem; color: var(--unsaac-text-secondary)"></i>
      <h2 class="h6 text-muted mt-3 mb-0">No hay expedientes pendientes en su oficina</h2>
    </div>

    <div id="contenedor-bandeja" class="d-flex flex-column gap-3"></div>
  </div>

  <!-- Modal Observar -->
  <div class="modal fade" id="modal-observar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="h6 titulo-institucional mb-0">Observar expediente</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label small">Documento observado</label>
            <select class="form-select" id="select-requisito-observar"></select>
          </div>
          <div class="mb-2">
            <label class="form-label small">Comentario (mínimo 10 caracteres)</label>
            <textarea class="form-control" id="texto-comentario-observar" rows="3"></textarea>
          </div>
          <div class="alert alert-danger py-2 small" id="error-observar" hidden></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-institucional" id="btn-confirmar-observar">Registrar observación</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Rechazar -->
  <div class="modal fade" id="modal-rechazar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="h6 titulo-institucional mb-0">Rechazar expediente</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label small">Motivo (mínimo 20 caracteres)</label>
          <textarea class="form-control" id="texto-motivo-rechazar" rows="3"></textarea>
          <div class="alert alert-danger py-2 small mt-2" id="error-rechazar" hidden></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-institucional" id="btn-confirmar-rechazar">Confirmar rechazo</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="static/js/config.js"></script>
  <script src="static/js/sesion.js"></script>
  <script src="static/js/bandeja.js"></script>
</body>
</html>
