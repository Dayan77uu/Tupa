<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de usuarios — Panel administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <header class="tupa-header">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="logo-circulo">UNSAAC</div>
        <div>
          <h1 class="h6 mb-0 fw-semibold text-white">Gestión de usuarios</h1>
          <p class="subtitulo d-none d-sm-block">Panel del Administrador del Sistema</p>
        </div>
      </div>
      <div class="d-flex gap-2">
        <a href="admin-catalogo.html" class="btn btn-outline-light btn-sm">Catálogo</a>
        <a href="reportes.html" class="btn btn-outline-light btn-sm">Reportes</a>
      </div>
    </div>
  </header>

  <div class="container py-4" style="max-width: 700px">
    <div class="alert" style="background-color:#EFF6FF;border:1px solid #BFDBFE;color:#1e40af;">
      <i class="bi bi-info-circle"></i>
      Dataset sintético para desarrollo/demo. Usa DNI y correos claramente ficticios — nunca datos reales de <code>talumno</code>.
    </div>

    <div class="card">
      <div class="card-body p-4">
        <h2 class="h6 titulo-institucional mb-3">Crear usuario</h2>
        <form id="form-usuario" class="row g-3">
          <div class="col-md-6">
            <label class="form-label small">DNI / ID de usuario</label>
            <input type="text" class="form-control" id="input-cidtusuario" required />
          </div>
          <div class="col-md-6">
            <label class="form-label small">Correo institucional</label>
            <input type="email" class="form-control" id="input-correo" placeholder="usuario@unsaac.edu.pe" required />
          </div>
          <div class="col-md-6">
            <label class="form-label small">Nombres</label>
            <input type="text" class="form-control" id="input-nombres" required />
          </div>
          <div class="col-md-3">
            <label class="form-label small">Apellido paterno</label>
            <input type="text" class="form-control" id="input-appat" />
          </div>
          <div class="col-md-3">
            <label class="form-label small">Apellido materno</label>
            <input type="text" class="form-control" id="input-apmat" />
          </div>
          <div class="col-md-6">
            <label class="form-label small">Rol</label>
            <select class="form-select" id="input-rol" required>
              <option value="ESTUDIANTE">ESTUDIANTE</option>
              <option value="USUARIO DE RECAUDACION">USUARIO DE RECAUDACION (Personal Administrativo)</option>
              <option value="COORDINADOR DE TESORERIA">COORDINADOR DE TESORERIA (Personal Administrativo)</option>
              <option value="OPERADOR DE OTI">OPERADOR DE OTI (Personal Administrativo)</option>
              <option value="ADMINISTRADOR">ADMINISTRADOR (Administrador del Sistema)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small">Oficina (si aplica)</label>
            <select class="form-select" id="input-oficina"></select>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-institucional">Crear usuario</button>
          </div>
        </form>
        <div class="alert alert-danger py-2 small mt-3" id="error-crear" hidden></div>
        <div class="alert alert-success py-2 small mt-3" id="exito-crear" hidden></div>
      </div>
    </div>
  </div>

  <script src="static/js/config.js"></script>
  <script src="static/js/sesion.js"></script>
  <script src="static/js/admin-usuarios.js"></script>
</body>
</html>
