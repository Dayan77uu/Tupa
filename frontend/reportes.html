<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes de desempeño — Panel administrativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <header class="tupa-header">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-3">
        <div class="logo-circulo">UNSAAC</div>
        <div>
          <h1 class="h6 mb-0 fw-semibold text-white">Reportes de desempeño</h1>
          <p class="subtitulo d-none d-sm-block">Panel administrativo</p>
        </div>
      </div>
      <div class="d-flex gap-2">
        <a href="bandeja.html" class="btn btn-outline-light btn-sm">Bandeja</a>
        <a href="login.html" class="btn btn-outline-light btn-sm">Salir</a>
      </div>
    </div>
  </header>

  <div class="container py-4">
    <div class="card mb-4">
      <div class="card-body p-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label small">Período</label>
            <select class="form-select" id="filtro-periodo">
              <option value="semana">Última semana</option>
              <option value="mes" selected>Último mes</option>
              <option value="trimestre">Último trimestre</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small">Estado</label>
            <select class="form-select" id="filtro-estado">
              <option value="">Todos</option>
              <option value="PENDIENTE">Pendiente</option>
              <option value="EN_REVISION">En revisión</option>
              <option value="OBSERVADO">Observado</option>
              <option value="APROBADO">Aprobado</option>
              <option value="RECHAZADO">Rechazado</option>
            </select>
          </div>
          <div class="col-md-3" id="contenedor-filtro-oficina" hidden>
            <label class="form-label small">Oficina (solo Administrador)</label>
            <select class="form-select" id="filtro-oficina"></select>
          </div>
          <div class="col-md-3">
            <button type="button" class="btn btn-institucional w-100" id="btn-generar">Generar reporte</button>
          </div>
        </div>
      </div>
    </div>

    <div id="estado-carga" class="text-muted" hidden>Cargando...</div>
    <div id="error-general" class="alert alert-danger" hidden></div>
    <div id="sin-datos" class="alert alert-secondary" hidden></div>

    <div id="contenido-reporte" hidden>
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="card text-center"><div class="card-body"><p class="mb-1 small text-muted">Trámites atendidos</p><h3 id="metrica-atendidos"></h3></div></div>
        </div>
        <div class="col-md-3">
          <div class="card text-center"><div class="card-body"><p class="mb-1 small text-muted">Tiempo promedio (días)</p><h3 id="metrica-tiempo"></h3></div></div>
        </div>
        <div class="col-md-3">
          <div class="card text-center"><div class="card-body"><p class="mb-1 small text-muted">Trámites vencidos</p><h3 id="metrica-vencidos"></h3></div></div>
        </div>
        <div class="col-md-3">
          <div class="card text-center"><div class="card-body"><p class="mb-1 small text-muted">% cumplimiento</p><h3 id="metrica-cumplimiento"></h3></div></div>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body p-4">
          <h2 class="h6 titulo-institucional mb-3">Top 5 procedimientos más solicitados</h2>
          <div id="grafico-top5"></div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary" id="btn-exportar-pdf"><i class="bi bi-file-earmark-pdf"></i> Exportar PDF</button>
        <button type="button" class="btn btn-outline-secondary" id="btn-exportar-excel"><i class="bi bi-file-earmark-excel"></i> Exportar Excel</button>
      </div>
    </div>
  </div>

  <script src="static/js/config.js"></script>
  <script src="static/js/sesion.js"></script>
  <script src="static/js/reportes.js"></script>
</body>
</html>
