<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de expediente — Panel administrativo</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <header class="tupa-header">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <a href="bandeja.html" class="d-flex align-items-center gap-3">
        <div class="logo-circulo">UNSAAC</div>
        <div>
          <h1 class="h6 mb-0 fw-semibold text-white">Detalle de expediente</h1>
          <p class="subtitulo d-none d-sm-block">Panel administrativo</p>
        </div>
      </a>
      <a href="bandeja.html" class="btn btn-outline-light btn-sm">Volver a la bandeja</a>
    </div>
  </header>

  <div class="container py-4">
    <div id="estado-carga" class="text-muted">Cargando...</div>
    <div id="error-general" class="alert alert-danger" hidden></div>

    <div id="contenido" class="row g-4" hidden>
      <div class="col-lg-8">
        <div class="card mb-4">
          <div class="card-body p-4">
            <div class="d-flex align-items-start justify-content-between mb-2">
              <span class="badge border text-dark bg-white" id="texto-nro"></span>
              <span class="badge" id="badge-estado"></span>
            </div>
            <h2 class="titulo-institucional mb-1" id="texto-tramite"></h2>
            <p class="text-muted small mb-0">Solicitante: <span id="texto-solicitante"></span> (<span id="texto-correo"></span>)</p>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body p-4">
            <h3 class="h6 titulo-institucional mb-3">Documentos adjuntos</h3>
            <div id="lista-documentos"></div>
          </div>
        </div>

        <div class="card mb-4">
          <div class="card-body p-4">
            <h3 class="h6 titulo-institucional mb-3">Historial</h3>
            <div id="lista-historial"></div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card mb-4">
          <div class="card-body p-4">
            <h3 class="h6 titulo-institucional mb-3">Voucher de pago</h3>
            <p class="mb-1 small">N°: <span id="voucher-numero">—</span></p>
            <p class="mb-1 small">Monto: <span id="voucher-monto">—</span></p>
            <p class="mb-3 small">Estado: <span id="voucher-estado">—</span></p>
            <div class="d-flex gap-2" id="voucher-acciones">
              <button type="button" class="btn btn-outline-success btn-sm flex-fill" id="btn-validar-voucher">Validar</button>
              <button type="button" class="btn btn-outline-danger btn-sm flex-fill" id="btn-rechazar-voucher">Rechazar</button>
            </div>
            <div class="alert alert-danger py-2 small mt-2" id="error-voucher" hidden></div>
          </div>
        </div>

        <div class="card">
          <div class="card-body p-4">
            <h3 class="h6 titulo-institucional mb-3">Derivar a otra oficina</h3>
            <select class="form-select mb-2" id="select-oficina-destino"></select>
            <textarea class="form-control mb-2" id="texto-comentario-derivar" rows="3" placeholder="Comentario de derivación (mínimo 15 caracteres)"></textarea>
            <button type="button" class="btn btn-institucional w-100" id="btn-derivar">Derivar</button>
            <div class="alert alert-danger py-2 small mt-2" id="error-derivar" hidden></div>
            <div class="alert alert-success py-2 small mt-2" id="exito-derivar" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="static/js/sesion.js"></script>
  <script src="static/js/expediente-admin.js"></script>
</body>
</html>
