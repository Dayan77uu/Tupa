<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo TUPA — UNSAAC</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <nav class="navbar navbar-light bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Catálogo TUPA — UNSAAC</span>
      <a href="login.html" class="small">Iniciar sesión</a>
    </div>
  </nav>

  <div class="container">
    <div class="row g-2 mb-4">
      <div class="col-md-6">
        <input
          type="search"
          class="form-control"
          id="buscador"
          placeholder="Buscar por nombre, código o palabra clave..."
        />
      </div>
      <div class="col-md-3">
        <select class="form-select" id="filtro-unidad">
          <option value="">Todas las unidades</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" id="filtro-tipo" disabled>
          <option value="">Tipo (no disponible)</option>
        </select>
      </div>
    </div>

    <div id="estado-carga" class="text-muted" hidden>Buscando...</div>

    <div id="sin-resultados" class="alert alert-secondary" hidden>
      No se encontraron procedimientos con ese criterio.
      <div id="contenedor-sugerencias" class="mt-3"></div>
    </div>

    <div id="contenedor-resultados" class="row g-3"></div>
  </div>

  <script src="static/js/catalogo.js"></script>
</body>
</html>
