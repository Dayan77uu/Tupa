<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha del trámite — TUPA UNSAAC</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="static/css/estilos.css" />
</head>
<body>
  <nav class="navbar navbar-light bg-white border-bottom mb-4">
    <div class="container">
      <a href="catalogo.html" class="small">&larr; Volver al catálogo</a>
    </div>
  </nav>

  <div class="container">
    <div id="estado-carga" class="text-muted">Cargando ficha...</div>
    <div id="error-ficha" class="alert alert-danger" hidden></div>

    <div id="contenido-ficha" hidden>
      <span class="badge bg-light text-dark mb-2" id="ficha-codigo"></span>
      <h1 class="h4" id="ficha-nombre"></h1>
      <p class="text-muted" id="ficha-descripcion"></p>

      <div class="row g-3 my-3">
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h2 class="h6 text-muted">Costo</h2>
              <p class="mb-0" id="ficha-costo"></p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h2 class="h6 text-muted">Plazo</h2>
              <p class="mb-0" id="ficha-plazo"></p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body">
              <h2 class="h6 text-muted">Oficina responsable</h2>
              <p class="mb-0" id="ficha-oficina"></p>
            </div>
          </div>
        </div>
      </div>

      <h2 class="h6">Requisitos</h2>
      <ol id="ficha-requisitos"></ol>

      <button type="button" class="btn btn-primary mt-3" disabled title="Disponible en Sprint 2">
        Iniciar trámite
      </button>
    </div>
  </div>

  <script src="static/js/ficha.js"></script>
</body>
</html>
